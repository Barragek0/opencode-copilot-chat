name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Compile TypeScript
        run: npm run compile

      - name: 🔎 Lint source and maintenance docs
        env:
          # The `shellcheck` npm package downloads its binary from GitHub
          # releases on first run, which flakes in CI (socket hang up / rate
          # limits). Use the runner's system binary instead.
          SHELLCHECKJS_BIN: /usr/bin/shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          npm run lint

      - name: 🎨 Check formatting
        run: npm run format:check

      - name: 🧪 Run tests
        run: npm test

      - name: 📦 Package VSIX (dry run)
        run: npm run package

      - name: 📤 Upload VSIX artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opencode-copilot-chat-${{ github.sha }}
          path: "*.vsix"
          retention-days: 14
